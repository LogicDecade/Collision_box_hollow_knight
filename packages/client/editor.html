<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>碰撞箱 · 地图编辑器</title>
    <style>
      :root {
        --ink: #d8d8d2;
        --dim: #9a9a92;
        --line: #3a3a36;
        --accent: #72c9f2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #12120f; color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #cb-top {
        display: flex; align-items: center; gap: 16px; padding: 10px 16px;
        border-bottom: 1px solid #22221e;
      }
      #cb-top h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.1em; margin: 0; color: var(--accent); }
      #cb-top a { color: var(--dim); text-decoration: none; font-size: 12px; margin-left: auto; }
      #cb-top a:hover { color: var(--accent); }
      #cb-body { display: flex; height: calc(100% - 46px); }
      #cb-canvas { flex: 1; min-width: 0; position: relative; }
      #cb-side {
        width: 340px; flex: none; overflow-y: auto; padding: 8px 12px 24px;
        border-left: 1px solid #22221e; background: #141410;
      }
      #cb-side section { margin: 14px 0; }
      #cb-side h3 {
        font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: var(--dim);
        margin: 0 0 8px; text-transform: uppercase;
      }
      #cb-side label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: 5px 0; }
      #cb-side label > span { width: 86px; flex: none; }
      #cb-side input[type="number"], #cb-side input[type="text"], #cb-side select {
        flex: 1; min-width: 0; background: #1a1a16; color: var(--ink); border: 1px solid var(--line);
        padding: 6px 8px; font-size: 13px; outline: none;
      }
      #cb-side input:focus, #cb-side select:focus { border-color: var(--accent); }
      #cb-side input[type="checkbox"] { accent-color: var(--accent); }
      #cb-side button {
        background: transparent; color: var(--dim); border: 1px solid var(--line);
        padding: 6px 10px; font-size: 13px; cursor: pointer; letter-spacing: 0.05em;
      }
      #cb-side button:hover { border-color: var(--accent); color: var(--accent); }
      #cb-side .cb-tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
      #cb-side .cb-tools button { flex: 1; }
      #cb-side .cb-tools button.on { border-color: var(--accent); color: var(--accent); }
      #cb-side .cb-row { display: flex; align-items: center; }
      #cb-side .cb-danger { color: #e06b4f; border-color: #5a2f24; margin-top: 10px; width: 100%; }
      #cb-side .cb-danger:hover { color: #ff8a70; border-color: #e06b4f; }
      #cb-side .cb-objtitle { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin: 4px 0 8px; }
      #cb-side textarea { width: 100%; background: #1a1a16; color: var(--ink);
        border: 1px solid var(--line); font-size: 12px; font-family: ui-monospace, monospace; }
      #cb-side .cb-hint { font-size: 11px; color: #6a6a62; line-height: 1.7; margin: 10px 0 0; }
      #cb-side .cb-flash {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        background: #1c2a24; border: 1px solid #2f7f4f; color: #a8e6bd;
        padding: 8px 18px; font-size: 13px; z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="cb-top">
      <h1>碰撞箱 · 地图编辑器</h1>
      <span style="color:#6a6a62;font-size:12px">非网格房间 · RoomDef</span>
      <a href="/">← 返回游戏</a>
    </div>
    <div id="cb-body">
      <div id="cb-canvas"></div>
      <aside id="cb-side"></aside>
    </div>
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
